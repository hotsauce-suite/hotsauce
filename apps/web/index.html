<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hotsauce</title>
    <meta name="description" content="Docs, meetings and more for the team." />
    <meta name="theme-color" content="#f2eadf" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1815" media="(prefers-color-scheme: dark)" />
    <script>
      // The member's light, dark or own theme (src/lib/theme.ts), applied before the first paint.
      var theme = null
      var own = null
      var style = null
      var fonts = null
      try {
        theme = localStorage.getItem('hearth:theme')
        own = JSON.parse(localStorage.getItem('hotsauce:custom-theme') || 'null')
      } catch {}
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      // Follow the sun: the look worked out last time; the app checks the sun again as it starts.
      if (theme === 'sun') {
        var sun = null
        try {
          sun = localStorage.getItem('hotsauce:sun-scheme')
        } catch {}
        document.documentElement.dataset.theme = sun === 'dark' ? 'dark' : 'light'
      }
      if (theme && own && theme === 'custom:' + own.id && typeof own.css === 'string') {
        document.documentElement.dataset.scheme = own.scheme === 'dark' ? 'dark' : 'light'
        style = document.createElement('style')
        style.id = 'hotsauce-custom-theme'
        style.textContent = own.css
        document.head.appendChild(style)
        fonts = document.createElement('link')
        fonts.id = 'hotsauce-custom-theme-fonts'
        fonts.rel = 'stylesheet'
        fonts.href = own.fonts
        document.head.appendChild(fonts)
        document.documentElement.dataset.theme = 'custom'
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
