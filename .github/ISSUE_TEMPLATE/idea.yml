name: An idea
description: Suggest a feature or an improvement.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you're stuck on, in your own words. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working, if you have a view.
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
