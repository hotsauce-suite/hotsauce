name: Feedback board

# Keeps the "Feedback" project board and the feedback issues' labels in step
# (ARCHITECTURE, Send feedback). Off until the repository has a FEEDBACK_BOARD
# variable set to on. Needs the FEEDBACK_PROJECT_TOKEN secret: a
# fine-grained token with Projects read/write on the organization and Issues
# read/write on this repository. Without it, only the labels are created.

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup creates the board if it is missing; sweep re-syncs everything'
        type: choice
        options: [sweep, setup]
        default: sweep

permissions:
  contents: read
  issues: write

concurrency:
  group: feedback-board
  cancel-in-progress: false

jobs:
  sync:
    if: vars.FEEDBACK_BOARD == 'on' && (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'feedback'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          HAS_TOKEN: ${{ secrets.FEEDBACK_PROJECT_TOKEN != '' }}
          MODE: ${{ github.event_name == 'issues' && 'event' || inputs.mode || 'sweep' }}
        with:
          github-token: ${{ secrets.FEEDBACK_PROJECT_TOKEN || github.token }}
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/feedback-board.mjs`)
            await run({ github, context, core, mode: process.env.MODE, hasToken: process.env.HAS_TOKEN === 'true' })
