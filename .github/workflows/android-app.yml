name: Android app

# Builds the Android app (apps/android, docs/PLAN-android.md). Pull requests that touch it get its
# unit tests, Android lint and a debug build. After each Release run on main it builds the
# release bundle (AAB), signed when the upload key secrets exist (ANDROID_UPLOAD_KEYSTORE, base64,
# and ANDROID_UPLOAD_PASSWORD, from apps/android/scripts/create-upload-key.sh). A signed bundle
# for a version code not published yet goes on the prerelease android-app-<version code> (the
# first one is uploaded to Play by hand, which creates the app there) and, when the
# ANDROID_PLAY_SERVICE_ACCOUNT secret (a Google Cloud service account's JSON key, invited in Play
# Console) exists, to Google Play internal testing (R12). Without it that step is skipped.
on:
  pull_request:
    paths:
      - apps/android/**
      - HOTSAUCE_VERSION
      - .github/workflows/android-app.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and a debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/
          retention-days: 7

  bundle:
    if: >-
      github.repository == 'hotsauce-suite/hotsauce' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: android-app
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack the upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::No upload key yet; the bundle is unsigned."
          fi
      - name: Build the release bundle
        run: ./gradlew --no-daemon testReleaseUnitTest bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hotsauce-android-${{ github.run_number }}
          path: apps/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Publish the bundle on GitHub
        id: publish
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="$(tr -d '[:space:]' < ../../HOTSAUCE_VERSION)"
          IFS=. read -r MAJOR MINOR PATCH <<<"$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          TAG="android-app-$CODE"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "::notice::$TAG is already published; nothing new to send."
            exit 0
          fi
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/Hotsauce-$VERSION.aab"
          gh release create "$TAG" -R "$REPO" --prerelease --target "$(git rev-parse HEAD)" \
            --title "Android app $VERSION" \
            --notes "Hotsauce for Android $VERSION (version code $CODE), signed with the upload key. Google Play installs it; this file is for uploading there." \
            "$RUNNER_TEMP/Hotsauce-$VERSION.aab"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - name: Check for the Play upload key
        id: play
        env:
          PLAY_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No ANDROID_PLAY_SERVICE_ACCOUNT yet; not sending to Google Play."; fi
      - name: Send to Google Play internal testing
        if: steps.publish.outputs.new == 'true' && steps.play.outputs.ready == 'true'
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT }}
        run: node scripts/play-upload.mjs app/build/outputs/bundle/release/app-release.aab
