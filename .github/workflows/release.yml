name: Release

# A merge that raises HOTSAUCE_VERSION on main is a release (docs/PLAN-releases-and-updates.md):
# this tags v<version>, publishes the release with notes, and pushes the image every instance
# runs, ghcr.io/hotsauce-suite/hotsauce:<version> and :latest. A version already tagged does
# nothing, so ordinary merges pass straight through.
on:
  push:
    branches: [main]
    paths: [HOTSAUCE_VERSION]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this version new?
        id: version
        run: |
          version="$(tr -d '[:space:]' < HOTSAUCE_VERSION)"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HOTSAUCE_VERSION must look like 1.2.3, not '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.new == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.new == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Tag and publish only once the image exists, so an instance that sees the release can
      # always pull it.
      - if: steps.version.outputs.new == 'true'
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Hotsauce $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
