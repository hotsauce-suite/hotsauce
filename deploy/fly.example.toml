# Hotsauce on Fly.io: one always-on machine with one volume, about $6 a month.
# scripts/deploy-fly.sh copies this to fly.<app>.toml (repo root) with your app name and address filled in.
# Everything else (your organization, sign-in, AI keys) is set in the setup wizard.

app = "APP_NAME"
primary_region = "REGION"
# SIGTERM to SIGKILL: shutdown lets uploads and git writes finish.
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  PUBLIC_URL = "PUBLIC_URL_VALUE"

[mounts]
  source = "hotsauce_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
